[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "attackgen"
version = "0.17.0"
description = "Generate tailored incident-response scenarios from MITRE ATT&CK / ATLAS using LLMs"
# 3.11 floor, not 3.10: litellm 1.98.0+ imports `NotRequired`/`Required` from
# stdlib `typing` on the `import litellm` path, which is 3.11+ only. See the
# matrix comment in .github/workflows/tests.yml.
requires-python = ">=3.11"
# The one runtime dependency list. requirements.txt is `-e .`, so Docker, CI
# and `pip install -r requirements.txt` all resolve from here.
dependencies = [
    "langsmith",
    "litellm>=1.83.7",
    # Floor is 2.0, not 1.2: mcp_server.py imports mcp.server.mcpserver, which
    # does not exist on 1.x. A 1.x resolve would fail at import, not at runtime.
    "mcp>=2.0.0,<3",
    "mitreattack-python",
    "openai",
    "pandas",
    "python-dotenv",
    # Floor kept as a guard so a future resolve cannot land on a version below
    # the CVE-2025-47273 (78.1.1) and CVE-2026-59890 (83.0.0) fixes. It is not
    # what cleared those alerts — they were never about the installed
    # setuptools, which already resolved to 84.0.0. See the skip-files note in
    # security.yml.
    "setuptools>=83.0.0",
    # Floor is 1.55, not unpinned: every earlier version's frontend
    # colour-parses three deprecated CustomThemeConfig fields
    # (widgetBackgroundColor, widgetBorderColor, skeletonBackgroundColor) that
    # no config.toml key can set, so any [theme] section made the browser log
    # 'Invalid color passed for <key> in theme.sidebar: ""' on every rerun.
    # 1.55 removed those fields. tests/test_console_smoke.py fails below this
    # floor.
    "streamlit>=1.66.0",
    # litellm imports tenacity lazily inside its retry helper (litellm/main.py)
    # and raises "tenacity import failed please run `pip install tenacity`"
    # when it is missing, but does not declare it. core/llm.py always sets
    # num_retries=3, so that path is reached on every failed call — without
    # this, a provider error reaches the user as a bogus install instruction
    # instead of the real message. Streamlit declared tenacity through 1.61 and
    # dropped it in 1.62, so the floor above still resolves to a Streamlit that
    # does not supply it for free.
    "tenacity",
]

[project.scripts]
attackgen-mcp = "mcp_server:main"

[tool.setuptools]
py-modules = ["mcp_server", "atlas_parser"]
packages = ["core", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "browser: launches a real Streamlit server and Chromium via Playwright; skips itself when unavailable (see tests/conftest.py)",
]

[tool.bandit]
# Replaces the old .bandit INI file, whose entries never applied: it used
# `exclude_dirs` (a TOML/YAML key, not an INI one) with leading-slash paths
# that matched nothing, so every run scanned tests/ anyway.
# The workflow already installs bandit[toml], which is what reads this.
#
# tests/ is excluded because pytest asserts trip B101 on every line — 425 of
# the 428 findings came from there, which is what buried the other three.
exclude_dirs = ["tests", ".venv", "venv", ".git"]
