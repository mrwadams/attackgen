name: Security Scanning

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  python-security:
    name: Python Security Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit[toml] pip-audit

      - name: Run Bandit security linter
        run: |
          # Full-fidelity report for the artifact: every severity, never gates.
          bandit -c pyproject.toml -r . -f json -o bandit-report.json || true
          # The gate. -ll -ii fails the job on medium-or-above severity at
          # medium-or-above confidence. Anything quieter stays in the artifact
          # above rather than failing the build.
          bandit -c pyproject.toml -r . -f txt -ll -ii

      - name: Run pip-audit for dependency vulnerabilities
        run: |
          # Full-fidelity report for the artifact, same split as Bandit above.
          pip-audit --desc --format json > pip-audit-report.json || true
          # The gate. pip-audit exits non-zero on any known vulnerability.
          # If a transitive dependency picks up a CVE with no fix available,
          # suppress it here with `--ignore-vuln GHSA-xxxx` and a reason, so
          # the exception lands in a reviewable diff rather than being blanket
          # ignored by continue-on-error.
          pip-audit --desc

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: python-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          retention-days: 30

  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [ 'python' ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  docker-security:
    name: Docker Image Security
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t attackgen:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: attackgen:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
          # `severity` alone does not apply to SARIF output; without this the
          # Security tab also collects LOW/UNKNOWN base-image findings.
          limit-severities-for-sarif: true
          # Base-image CVEs with no vendor patch cannot be actioned here, and
          # they crowd out the findings that can be.
          ignore-unfixed: true
          # pip ships a CycloneDX SBOM of its own vendored tree. Trivy parses it
          # and reports those pins as installed packages, which they are not:
          # it claimed setuptools 70.3.0 while site-packages held 84.0.0. Only
          # pip imports pip._vendor, and it does not run in the container at
          # runtime. Real site-packages metadata is still scanned.
          skip-files: 'usr/local/lib/python3.14/site-packages/pip/_vendor/bom.cdx.json'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy in table format
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: attackgen:${{ github.sha }}
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          ignore-unfixed: true
          skip-files: 'usr/local/lib/python3.14/site-packages/pip/_vendor/bom.cdx.json'

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          deny-licenses: GPL-3.0, AGPL-3.0

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    needs: [python-security, secret-scanning, codeql-analysis]
    if: always()

    steps:
      - name: Check security scan results
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Python Security: ${{ needs.python-security.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ Secret Scanning: ${{ needs.secret-scanning.result }}" >> $GITHUB_STEP_SUMMARY
          echo "✅ CodeQL Analysis: ${{ needs.codeql-analysis.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the workflow logs and Security tab." >> $GITHUB_STEP_SUMMARY
