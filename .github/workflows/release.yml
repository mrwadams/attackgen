name: Release

# Fires on version tags (e.g. v0.14.0). One tag drives the whole release:
# verify the tag matches the packaged version, run the test suite, build and
# push the multi-arch image to Docker Hub, then cut a GitHub Release with
# generated notes.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  # Never cancel an in-flight release: a half-published tag is worse than a wait.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Check tag matches packaged version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION="$(grep -m1 -E '^version\s*=' pyproject.toml | cut -d'"' -f2)"
          echo "Tag: $TAG  |  pyproject version: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $VERSION. Bump the version and re-tag."
            exit 1
          fi

  test:
    name: Test (Python ${{ matrix.python-version }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 was dropped in favour of a 3.11 floor: litellm 1.98.0+ imports
        # `NotRequired`/`Required` from stdlib `typing` (3.11+) on the `import
        # litellm` path, so `import core` — and therefore every test — fails to
        # collect on 3.10. litellm still declares `requires-python >=3.10`, but
        # has broken it repeatedly (BerriAI/litellm#38076, #38892); 1.100.0 is
        # still broken even after the #39448 fix. 3.10 reaches EOL in Oct 2026
        # and the shipped Docker image runs 3.14, so capping litellm to keep it
        # alive would freeze the model registry for no real benefit.
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest

  browser:
    needs: verify
    # The console and accessibility smoke checks skip themselves without a
    # browser, so the matrix job above never runs them — which is how a fix
    # that did not work and four broken tests reached review in #94. This job
    # is the one place they actually execute. It is not part of the matrix:
    # they drive a browser, not the interpreter, so a second Python version
    # would re-download Chromium to prove nothing new.
    name: Browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Resolve the Playwright version
        id: playwright
        # Keys the browser cache on the version that will actually be used, so
        # an unpinned playwright picking up a new release re-downloads a
        # matching Chromium instead of reusing a stale one.
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Run browser checks
        # ATTACKGEN_REQUIRE_BROWSER=1 turns the fixtures' "no browser, no
        # server" skips into failures. Without it this job would report success
        # having run nothing, which is the failure mode it exists to close.
        env:
          ATTACKGEN_REQUIRE_BROWSER: '1'
        run: pytest -m browser

  docker:
    name: Build and push image
    needs: [verify, test, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: mrwadams/attackgen
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    name: Create GitHub Release
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
